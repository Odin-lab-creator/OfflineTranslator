<title>Ролики story world</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600&display=swap">
<style>
/* Layout: одна колонка, ролик 9:16 во всю ширину телефона, сверху пиксельная шапка канала */
:root {
  --bg: #0e0b14;
  --panel: #18131f;
  --fg: #eeeaf5;
  --muted: #9b93ab;
  --accent: #9e58ff;
  --red: #e2262c;
  --pixel: "Press Start 2P", ui-monospace, monospace;
  --body: "Inter", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
body {
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.5 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
header { display: flex; flex-direction: column; gap: 10px; }
.chan { font: 10px/1 var(--pixel); color: var(--accent); letter-spacing: 0.08em; }
h1 { margin: 0; font: 20px/1.3 var(--pixel); text-wrap: balance; }
.note { margin: 0; color: var(--muted); font-size: 14px; }
.film { display: flex; flex-direction: column; gap: 10px; }
.film h2 { margin: 0; font: 13px/1.4 var(--pixel); }
.film h2 b { color: var(--red); font-weight: 400; }
video {
  display: block; width: 100%; max-width: 100%; aspect-ratio: 9 / 16;
  background: #000; border: 3px solid #000; box-shadow: 6px 6px 0 var(--panel);
}
.meta { margin: 0; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
</style>

<div class="wrap">
  <header>
    <span class="chan">STORY WORLD · СЮЖЕТ ЗА МИНУТУ</span>
    <h1>Ролики</h1>
    <p class="note">Видео начинает играть сразу, не дожидаясь загрузки целиком. Это копия для просмотра (720p). Для публикации бери полный файл из чата.</p>
  </header>

  <section class="film" id="kloverfild-10">
    <h2>«Кловерфилд, <b>10</b>»</h2>
    <video id="v-kloverfild-10" src="kloverfild_10.mp4" poster="kloverfild_10.jpg" controls playsinline preload="metadata"></video>
    <p class="meta">1:37 · голос «Олег» · 5 оживлённых сцен</p>
  </section>
</div>
