name: Dictionary probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect WikDict files
        run: |
          set -x
          mkdir -p probe && cd probe
          curl -sSfL -o en-ru.sqlite3 https://download.wikdict.com/dictionaries/wdweb/en-ru.sqlite3
          curl -sSfL -o ru.sqlite3 https://download.wikdict.com/dictionaries/wdweb/ru.sqlite3 || true
          ls -l
          python3 - <<'PY' > ../probe.txt 2>&1
          import sqlite3, json, os
          for f in ["en-ru.sqlite3", "ru.sqlite3"]:
              if not os.path.exists(f): continue
              print("=====", f, os.path.getsize(f))
              c = sqlite3.connect(f)
              for (name, sql) in c.execute("select name, sql from sqlite_master"):
                  print("--", name); print(sql)
              for (name,) in c.execute("select name from sqlite_master where type in ('table','view')"):
                  try:
                      cur = c.execute(f'select * from "{name}" limit 3')
                      cols = [d[0] for d in cur.description]
                      print("## sample", name, cols)
                      for row in cur.fetchall():
                          print({k: (v[:400] if isinstance(v, str) else v) for k, v in zip(cols, row)})
                      print("count", c.execute(f'select count(*) from "{name}"').fetchone())
                  except Exception as e:
                      print("## sample", name, "ERROR", e)
              try:
                  cur = c.execute("select * from translation_block where written_rep in ('house','run','dog') limit 5")
                  cols = [d[0] for d in cur.description]
                  for row in cur.fetchall():
                      print("EXAMPLE", {k: v for k, v in zip(cols, row)})
              except Exception as e:
                  print("EXAMPLE ERROR", e)
          PY
          cd ..
          for l in bg de el en es fi fr id it ja la lt mg nl no pl pt ru sv tr; do
            for pair in "$l-ru" "ru-$l" "$l-en" "en-$l"; do
              case $pair in ru-ru|en-en) continue;; esac
              size=$(curl -sIL https://download.wikdict.com/dictionaries/wdweb/$pair.sqlite3 | grep -i '^content-length' | tail -1 | tr -d '\r' | awk '{print $2}')
              echo "SIZE $pair $size" >> probe.txt
            done
          done
          head -c 3000 probe.txt
      - name: Publish probe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dict-probe
          name: Dictionary probe (служебный)
          prerelease: true
          make_latest: false
          files: probe.txt
