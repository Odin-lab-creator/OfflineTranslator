name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY_PASSWORD != '' }}
      VERSION: 1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare launcher icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick > /dev/null
          shopt -s nocaseglob nullglob
          files=(*.png *.jpg *.jpeg *.webp)
          SRC="${files[0]}"
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d="${pair%%:*}"
            s="${pair##*:}"
            out="app/src/main/res/mipmap-$d"
            mkdir -p "$out"
            if [ -n "$SRC" ]; then
              convert "$SRC" -auto-orient -resize "${s}x${s}^" -gravity center -extent "${s}x${s}" "$out/ic_launcher.png"
            else
              convert -size "${s}x${s}" "xc:#2F5FD0" "$out/ic_launcher.png"
            fi
            cp "$out/ic_launcher.png" "$out/ic_launcher_round.png"
          done

      - name: Download Cyrillic OCR models
        run: |
          mkdir -p app/src/main/assets/tessdata
          for lang in rus ukr eng; do
            curl -sSfL --retry 3 -o "app/src/main/assets/tessdata/$lang.traineddata" \
              "https://github.com/tesseract-ocr/tessdata_fast/raw/HEAD/$lang.traineddata"
          done
          ls -la app/src/main/assets/tessdata

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build release APK
        env:
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleRelease -PciVersionCode=${{ github.run_number }} 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Could not resolve|Could not find" -A2 build.log \
            | grep -v "^--$" | head -40 > errors.txt || true
          split -l 8 errors.txt part_
          for f in part_*; do
            msg=$(sed 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')
            echo "::error::$msg"
          done

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk ValhallaTranslate.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ValhallaTranslate-${{ env.VERSION }}
          path: ValhallaTranslate.apk

      - name: Signing key reminder
        if: env.HAS_SIGNING_KEY != 'true'
        run: echo "::warning::Secret SIGNING_KEY_PASSWORD is not set. The APK is signed with a temporary key and is not published to Releases."

      - name: Publish to Releases
        if: github.ref == 'refs/heads/main' && env.HAS_SIGNING_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Valhalla Translate ${{ env.VERSION }}
          body: ${{ github.event.head_commit.message }}
          files: ValhallaTranslate.apk
          make_latest: true
